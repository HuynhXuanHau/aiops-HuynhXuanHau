version: 1
services:
  - name: frontend
    sli:
      name: frontend_availability
      kind: availability
      formula: "Successful page loads (no JS/network errors) / Total page loads"
      promql_good: 'sum(rate(frontend_events_total{js_error="false", network_error="false"}[$window]))'
      promql_total: 'sum(rate(frontend_events_total[$window]))'
      source: frontend_rum.jsonl
    slo:
      target: 0.985
      window_days: 30
      budget:
        total_events_per_month: 5184000
        allowed_failures_per_month: 77760
        downtime_minutes_equivalent: 864

  - name: api
    sli:
      name: api_availability
      kind: availability
      formula: "Successful HTTP requests (2xx, 3xx) / Total HTTP requests"
      promql_good: 'sum(rate(http_requests_total{status=~"2..|3.."}[$window]))'
      promql_total: 'sum(rate(http_requests_total[$window]))'
      source: access_log.jsonl
    slo:
      target: 0.975
      window_days: 30
      budget:
        total_events_per_month: 20737800
        allowed_failures_per_month: 518445
        downtime_minutes_equivalent: 1296

  - name: db
    sli:
      name: db_availability
      kind: availability
      formula: "Successful queries / Total queries"
      promql_good: 'sum(rate(db_queries_total{success="true"}[$window]))'
      promql_total: 'sum(rate(db_queries_total[$window]))'
      source: db_query_log.jsonl
    slo:
      target: 0.995
      window_days: 30
      budget:
        total_events_per_month: 1726380
        allowed_failures_per_month: 8632
        downtime_minutes_equivalent: 432