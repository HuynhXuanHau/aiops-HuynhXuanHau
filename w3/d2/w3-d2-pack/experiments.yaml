# experiments.yaml
- name: "1_payment_latency"
  fault_type: "latency"
  target: "payment-svc"
  duration: "60s"
  ground_truth: "payment-svc"
  hypothesis: "Steady-state: checkout_p99 <= 800ms. Khi payment-svc bị delay 500ms, pipeline phải detect được latency anomaly và RCA chỉ đích danh payment-svc."

- name: "2_payment_loss"
  fault_type: "network_loss"
  target: "payment-svc"
  duration: "60s"
  ground_truth: "payment-svc"
  hypothesis: "Khi mất gói 30% tại payment-svc, tỉ lệ lỗi HTTP tăng đột biến, pipeline cần nhóm các cảnh báo lỗi này và trỏ về đúng payment-svc."

- name: "3_inventory_kill"
  fault_type: "availability"
  target: "inventory-svc"
  duration: "60s"
  ground_truth: "inventory-svc"
  hypothesis: "Liên tục kill pod inventory-svc mỗi 60 giây. Pipeline phải bắt được lỗi sụt giảm availability và gọi tên inventory-svc."

- name: "4_gateway_cpu"
  fault_type: "cpu_saturation"
  target: "api-gateway"
  duration: "60s"
  ground_truth: "api-gateway"
  hypothesis: "Stress CPU gateway lên 90% gây chậm dây chuyền (cascade latency). RCA phải tỉnh táo chọn đúng api-gateway thay vì các service phía sau."

- name: "5_payment_db_memory"
  fault_type: "memory"
  target: "payment-svc"
  duration: "60s"
  ground_truth: "payment-svc"
  hypothesis: "Làm đầy RAM của payment-svc lên 95%. Hệ thống bị nghẽn connection pool, pipeline phải định vị chính xác lỗi xuất phát từ database."

- name: "6_auth_clock_skew"
  fault_type: "time_skew"
  target: "auth-svc"
  duration: "60s"
  ground_truth: "auth-svc"
  hypothesis: "Lệch thời gian +60s tại auth-svc làm lỗi xác thực JWT toàn hệ thống. Pipeline cần nhận diện bất thường cấu hình từ auth-svc."

- name: "7_log_disk_fill"
  fault_type: "disk_fill"
  target: "log-collector"
  duration: "60s"
  ground_truth: "log-collector"
  hypothesis: "Làm đầy ổ đĩa log-collector lên 95%. Log ingestion bị chậm (lag). Pipeline cần phát hiện lỗi ở tầng meta-monitoring này."

- name: "8_frontend_gateway_partition"
  fault_type: "network_partition"
  target: "frontend"
  duration: "30s"
  ground_truth: "frontend"
  hypothesis: "Cô lập hoàn toàn mạng giữa frontend và api-gateway trong 30s. User gặp timeout liên tục, RCA phải chỉ ra lỗi ở điểm nghẽn (edge partition)."

- name: "9_dns_slowdown"
  fault_type: "dns_latency"
  target: "dns-resolver"
  duration: "60s"
  ground_truth: "dns-resolver"
  hypothesis: "Làm chậm tra cứu DNS thêm 2s khiến các service gọi nhau bị chập chờn. Pipeline cần phân tích dựa trên topology mạng để tìm ra DNS."

- name: "10_checkout_retry_storm"
  fault_type: "cascade_retry"
  target: "checkout-svc"
  duration: "60s"
  ground_truth: "payment-svc"
  hypothesis: "HTTP 500 tại checkout-svc do lỗi từ payment-svc. Checkout sẽ thực hiện retry liên tục (retry storm). Bộ não RCA của pipeline KHÔNG ĐƯỢC chọn lầm checkout-svc (nơi phát ra nhiều alert nhất) mà phải tìm ra gốc rễ thực sự là payment-svc."