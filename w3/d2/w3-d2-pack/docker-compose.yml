services:
  # ==========================================
  # 1. HỆ THỐNG GIÁM SÁT
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: w3d1-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./burn_rate_alerts.yaml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --web.enable-lifecycle
    networks:
      - aiops_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: w3d1-alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - aiops_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: w3d1-grafana
    ports: ["3000:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    networks:
      - aiops_network

  # ==========================================
  # 2. HỆ THỐNG 10 MICROSERVICES (REAL MOCK)
  # ==========================================
  frontend:
    build: ./mock_service
    container_name: frontend
    ports: ["8080:80"]
    environment:
      - SERVICE_NAME=frontend
      - UPSTREAMS=api-gateway
    networks:
      - aiops_network

  api-gateway:
    build: ./mock_service
    container_name: api-gateway
    environment:
      - SERVICE_NAME=api-gateway
      - UPSTREAMS=payment-svc,inventory-svc,checkout-svc
    networks:
      - aiops_network

  payment-svc:
    build: ./mock_service
    container_name: payment-svc
    environment:
      - SERVICE_NAME=payment-svc
    networks:
      - aiops_network

  inventory-svc:
    build: ./mock_service
    container_name: inventory-svc
    environment:
      - SERVICE_NAME=inventory-svc
    networks:
      - aiops_network

  checkout-svc:
    build: ./mock_service
    container_name: checkout-svc
    environment:
      - SERVICE_NAME=checkout-svc
      - UPSTREAMS=payment-svc,inventory-svc
    networks:
      - aiops_network

  notification-svc:
    build: ./mock_service
    container_name: notification-svc
    environment:
      - SERVICE_NAME=notification-svc
    networks:
      - aiops_network

  auth-svc:
    build: ./mock_service
    container_name: auth-svc
    environment:
      - SERVICE_NAME=auth-svc
    networks:
      - aiops_network

  log-collector:
    build: ./mock_service
    container_name: log-collector
    environment:
      - SERVICE_NAME=log-collector
    networks:
      - aiops_network

  dns-resolver:
    build: ./mock_service
    container_name: dns-resolver
    environment:
      - SERVICE_NAME=dns-resolver
    networks:
      - aiops_network

  cache-svc:
    build: ./mock_service
    container_name: cache-svc
    environment:
      - SERVICE_NAME=cache-svc
    networks:
      - aiops_network

networks:
  aiops_network:
    driver: bridge